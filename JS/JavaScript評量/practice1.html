<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript評量第一題</title>
    <script type="text/javascript" src="HashMap.js"></script>
    <script>
        // 創建一個物件
        const map = new HashMap();

        window.onload = function () {

            // put鍵
            document.querySelector('#butPut').onclick = function () {
                let inputKey = document.querySelector('#key').value.trim();
                let result = document.querySelector('#res');

                // 建立result標籤的函式
                const creatResult = function (cKey, cValue) {
                    const showRes = document.createElement('p');
                    showRes.setAttribute('class', 'showRes');
                    showRes.innerHTML = cKey + ':' + cValue;
                    return showRes;

                };

                // 判斷條件
                if (!inputKey) {
                    alert('請輸入Key值');
                    return;
                };
                if (map.contains(inputKey)) {
                    alert('Key值不得重複');
                    document.querySelector('#key').value = '';
                    document.querySelector('#val').value = '';
                    return;
                };

                // 放入map中
                map.put(inputKey, document.querySelector('#val').value);

                result.innerHTML = '【RESULT】';

                // 取得k,v (new出的自定義物件不能用for in)
                const keys = map.keys();
                for (const ekey of keys) {
                    const eval = map.get(ekey);
                    result.appendChild(creatResult(ekey, eval))
                };

                //清空介面輸入框
                document.querySelector('#key').value = '';
                document.querySelector('#val').value = '';

            }

            // clear鍵
            document.querySelector('#butClear').onclick = function () {
                document.querySelector('#key').value = '';
                document.querySelector('#val').value = '';
                document.querySelector('#res').innerHTML = '';
                map.clear();
            }
        };
    </script>
    <style>
        span {
            display: inline-block;
            width: 70px;
        }

        .keyVal {
            padding: 5px;
        }

        hr {
            width: 50%;
            margin-left: 0;
        }

        .putClear {
            display: inline-flex;
            width: 40px;
            padding: 10px;
        }

        .showRes {
            margin-left: 20px;
            margin-bottom: 5px;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <div class="keyVal">
        <span>KEY</span><input type="text" id="key" />
    </div>
    <div class="keyVal">
        <span>VALUE</span><input type="text" id="val" />
    </div>
    <hr />
    <div class="putClear" id="butPut"><button>PUT</button></div>
    <div class="putClear" id="butClear"><button>CLEAR</button></div>
    <hr />
    <div id="res"></div>


</body>

</html>
